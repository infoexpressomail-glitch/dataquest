<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="blueCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Subtle glow ring -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.15" />

  <!-- Clipboard / Shield base -->
  <rect x="116" y="100" width="280" height="340" rx="36" fill="#1e293b" stroke="#334155" stroke-width="6" />
  
  <!-- Clipboard top clip -->
  <rect x="196" y="74" width="120" height="48" rx="14" fill="#3b82f6" stroke="#60a5fa" stroke-width="3" />
  <circle cx="256" cy="98" r="8" fill="#ffffff" />

  <!-- Survey list rows -->
  <!-- Row 1: Checkbox checked -->
  <rect x="156" y="160" width="36" height="36" rx="10" fill="#059669" />
  <path d="M165 178 l6 7 l12 -14" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="210" y="168" width="146" height="18" rx="6" fill="#94a3b8" />

  <!-- Row 2: Radio button active with audio wave -->
  <circle cx="174" cy="242" r="18" fill="#2563eb" />
  <circle cx="174" cy="242" r="7" fill="#ffffff" />
  <rect x="210" y="233" width="120" height="18" rx="6" fill="#cbd5e1" />

  <!-- Row 3: Survey bar metric -->
  <rect x="156" y="304" width="36" height="36" rx="10" fill="#6366f1" />
  <path d="M167 326 l4 -8 l5 5 l7 -11" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="210" y="300" width="156" height="14" rx="5" fill="#94a3b8" />
  <rect x="210" y="322" width="90" height="10" rx="4" fill="#64748b" />

  <!-- Floating Audio/Location Badge with vibrant glow -->
  <g filter="url(#glow)">
    <circle cx="370" cy="380" r="54" fill="url(#emeraldGrad)" stroke="#ffffff" stroke-width="4" />
    <!-- Microphone icon -->
    <rect x="362" y="356" width="16" height="28" rx="8" fill="#ffffff" />
    <path d="M352 372 C352 386, 388 386, 388 372" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="370" y1="388" x2="370" y2="402" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="360" y1="402" x2="380" y2="402" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
